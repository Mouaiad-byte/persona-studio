name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The collector runs on plain node with no build step, so a syntax error
      # in it would otherwise only surface at runtime.
      - name: Check collector parses
        run: |
          for file in $(find server shared -name '*.mjs'); do
            node --check "$file"
          done
